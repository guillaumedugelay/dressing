name: Tendances

# Régénère tendances.json chaque lundi matin. Sans le secret ANTHROPIC_API_KEY,
# la synthèse est sautée et le fichier reste inchangé — la chaîne peut donc être
# installée avant que la clé n'existe.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier la présence de la clé
        id: cle
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "presente=oui" >> "$GITHUB_OUTPUT"
          else
            echo "presente=non" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY absent — synthèse sautée, tendances.json inchangé."
          fi

      - name: Collecter les sources
        if: steps.cle.outputs.presente == 'oui'
        run: node outils/collecte.mjs > corpus.json

      - name: Installer le SDK
        if: steps.cle.outputs.presente == 'oui'
        run: npm install --no-save @anthropic-ai/sdk

      # La synthèse de la semaine est archivée telle quelle dans tendances/.
      # C'est elle, et non le fichier publié, qui constitue l'historique : le
      # cumul se recalcule à partir des archives, si bien que changer la
      # fenêtre ou la demi-vie ne demande de refaire aucune synthèse.
      - name: Synthétiser la semaine
        if: steps.cle.outputs.presente == 'oui'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p tendances
          node outils/synthese.mjs < corpus.json > "tendances/$(date -u +%Y-%m-%d).json"

      # Une semaine de flux RSS, c'est du bruit ; deux mois, c'est un signal.
      - name: Cumuler sur deux mois glissants
        if: steps.cle.outputs.presente == 'oui'
        run: node outils/cumuler.mjs

      - name: Publier si le résultat a changé
        if: steps.cle.outputs.presente == 'oui'
        run: |
          rm -f corpus.json
          git add -A tendances.json tendances/
          if git diff --quiet --cached; then
            echo "Aucun changement cette semaine."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Tendances de la semaine du $(date -u +%Y-%m-%d)"
          git push
